title: Skupper Hello World
subtitle: A minimal HTTP application deployed across Kubernetes clusters using Skupper
overview: "This example is a very simple multi-service HTTP application\ndeployed\
  \ across Kubernetes clusters using Skupper.\n\nIt contains two services:\n\n* A\
  \ backend service that exposes an `/api/hello` endpoint.  It\n  returns greetings\
  \ of the form `Hi, <your-name>.  I am <my-name>\n  (<pod-name>)`.\n\n* A frontend\
  \ service that sends greetings to the backend and\n  fetches new greetings in response.\n\
  \nWith Skupper, you can place the backend in one cluster and the\nfrontend in another\
  \ and maintain connectivity between the two\nservices without exposing the backend\
  \ to the public internet.\n\n<img src=\"images/entities.svg\" width=\"640\"/>\n"
sites:
  west:
    title: West
    platform: kubernetes
    namespace: west
    env:
      KUBECONFIG: ~/.kube/config-west
  east:
    title: East
    platform: kubernetes
    namespace: east
    env:
      KUBECONFIG: ~/.kube/config-east
steps:
- title: Access your Kubernetes clusters
  numbered: true
  preamble: 'Skupper is designed for use with multiple Kubernetes clusters.

    The `skupper` and `kubectl` commands use your

    [kubeconfig][kubeconfig] and current context to select the cluster

    and namespace where they operate.


    [kubeconfig]: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/


    This example uses multiple cluster contexts at once. The

    `KUBECONFIG` environment variable tells `skupper` and `kubectl`

    which kubeconfig to use.


    For each cluster, open a new terminal window.  In each terminal,

    set the `KUBECONFIG` environment variable to a different path and

    log in to your cluster.'
  postamble: '**Note:** The login procedure varies by provider.'
  commands:
    west:
    - run: export KUBECONFIG=~/.kube/config-west
    - run: <provider-specific login command>
      apply: readme
    east:
    - run: export KUBECONFIG=~/.kube/config-east
    - run: <provider-specific login command>
      apply: readme
- title: Create your Kubernetes namespaces
  numbered: true
  preamble: 'The example application has different components deployed to

    different Kubernetes namespaces.  To set up our example, we need

    to create the namespaces.


    For each cluster, use `kubectl create namespace` and `kubectl

    config set-context` to create the namespace you wish to use and

    set the namespace on your current context.'
  commands:
    west:
    - run: kubectl create namespace west
      apply: readme
    - run: kubectl create namespace west --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace west
    east:
    - run: kubectl create namespace east
      apply: readme
    - run: kubectl create namespace east --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace east
- title: Deploy the frontend and backend
  numbered: true
  preamble: 'Deploy the Hello World components, placing the frontend on one

    cluster and the backend on the other.


    Use `kubectl create deployment` to deploy the frontend in West

    and the backend in East.'
  commands:
    west:
    - run: kubectl create deployment frontend --image quay.io/pwright/getback:hc
      apply: readme
    - run: kubectl create deployment frontend --image quay.io/pwright/getback:hc
        --dry-run=client -o json | jq '.spec.template.spec.containers |= map(.imagePullPolicy
        = "IfNotPresent")' | kubectl apply -f -
      apply: test
    east:
    - run: kubectl create deployment backend --image quay.io/pwright/getback:hc
        --replicas 3
      apply: readme
    - run: kubectl create deployment backend --image quay.io/pwright/getback:hc
        --replicas 3 --dry-run=client -o json | jq '.spec.template.spec.containers
        |= map(.imagePullPolicy = "IfNotPresent")' | kubectl apply -f -
      apply: test
- title: Install Skupper on your Kubernetes clusters
  numbered: true
  preamble: 'Using Skupper on Kubernetes requires the installation of the

    Skupper custom resource definitions (CRDs) and the Skupper

    controller.


    For each cluster, use `kubectl apply` with the Skupper

    installation YAML to install the CRDs and controller.'
  commands:
    west:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
    east:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
- title: Install the Skupper command-line tool
  numbered: true
  preamble: 'This example uses the Skupper command-line tool to create Skupper

    resources.  You need to install the `skupper` command only once

    for each development environment.


    On Linux or Mac, you can use the install script (inspect it

    [here][install-script]) to download and extract the command:


    ~~~ shell

    curl https://skupper.io/v2/install.sh | sh

    ~~~


    The script installs the command under your home directory.  It

    prompts you to add the command to your path if necessary.


    For Windows and other installation options, see [Installing

    Skupper][install-docs].


    [install-script]: https://github.com/skupperproject/skupper-website/blob/main/input/install.sh

    [install-docs]: https://skupper.io/#installation'
- title: Create your sites
  numbered: true
  preamble: 'A Skupper _site_ is a location where your application workloads

    are running.  Sites are linked together to form a network for your

    application.


    For each namespace, use `skupper site create` with a site name of

    your choice.  This creates the site resource and deploys the

    Skupper router to the namespace.


    **Note:** If you are using Minikube, you need to [start minikube

    tunnel][minikube-tunnel] before you run `skupper site create`.


    <!-- XXX Explain enabling link acesss on one of the sites -->


    [minikube-tunnel]: https://skupper.io/start/minikube.html#running-minikube-tunnel'
  postamble: 'You can use `skupper site status` at any time to check the status

    of your site.'
  commands:
    west:
    - run: skupper site create west --enable-link-access
      output: 'Waiting for status...

        Site "west" is configured. Check the status to see when it is ready

        '
    east:
    - run: skupper site create east
      output: 'Waiting for status...

        Site "east" is configured. Check the status to see when it is ready

        '
- title: Link your sites
  numbered: true
  preamble: 'A Skupper _link_ is a channel for communication between two sites.

    Links serve as a transport for application connections and

    requests.


    Creating a link requires the use of two Skupper commands in

    conjunction: `skupper token issue` and `skupper token redeem`.

    The `skupper token issue` command generates a secret token that

    can be transferred to a remote site and redeemed for a link to the

    issuing site.  The `skupper token redeem` command uses the token

    to create the link.


    **Note:** The link token is truly a *secret*.  Anyone who has the

    token can link to your site.  Make sure that only those you trust

    have access to it.


    First, use `skupper token issue` in West to generate the token.

    Then, use `skupper token redeem` in East to link the sites.'
  postamble: 'If your terminal sessions are on different machines, you may need

    to use `scp` or a similar tool to transfer the token securely.  By

    default, tokens expire after a single use or 15 minutes after

    being issued.'
  commands:
    west:
    - run: skupper token issue ~/secret.token
      output: "Waiting for token status ...\n\nGrant \"west-cad4f72d-2917-49b9-ab66-cdaca4d6cf9c\"\
        \ is ready\nToken file /run/user/1000/skewer/secret.token created\n\nTransfer\
        \ this file to a remote site. At the remote site,\ncreate a link to this site\
        \ using the \"skupper token redeem\" command:\n\n\tskupper token redeem <file>\n\
        \nThe token expires after 1 use(s) or after 15m0s.\n"
    east:
    - run: skupper token redeem ~/secret.token
      output: 'Waiting for token status ...

        Token "west-cad4f72d-2917-49b9-ab66-cdaca4d6cf9c" has been redeemed

        You can now safely delete /run/user/1000/skewer/secret.token

        '
- title: Expose the backend service
  numbered: true
  preamble: 'We now have our sites linked to form a Skupper network, but no

    services are exposed on it.


    Skupper uses _listeners_ and _connectors_ to expose services

    across sites inside a Skupper network.  A listener is a local

    endpoint for client connections, configured with a routing key.  A

    connector exists in a remote site and binds a routing key to a

    particular set of servers.  Skupper routers forward client

    connections from local listeners to remote connectors with

    matching routing keys.


    In West, use the `skupper listener create` command to create a

    listener for the backend.  In East, use the `skupper connector

    create` command to create a matching connector.'
  postamble: 'The commands shown above use the name argument, `backend`, to also

    set the default routing key and pod selector.  You can use the

    `--routing-key` and `--selector` options to set specific values.


    <!-- You can also use `--workload` -- more convenient! -->'
  commands:
    west:
    - run: skupper listener create backend 9091
      output: 'Waiting for create to complete...

        Listener "backend" is ready

        '
    east:
    - run: skupper connector create backend 9091
      output: 'Waiting for create to complete...

        Connector "backend" is ready

        '
- title: Expose the backend metrics service
  numbered: true
  preamble: 'The backend also exposes a metrics endpoint on port 9092.

    Create a second listener/connector pair to expose the metrics service.'
  commands:
    west:
    - run: skupper listener create backend-metrics 9192 --routing-key backend-metrics
      output: 'Waiting for create to complete...

        Listener "backend-metrics" is ready

        '
    east:
    - run: skupper connector create backend-metrics 9092 --routing-key backend-metrics --workload deployment/backend
      output: 'Waiting for create to complete...

        Connector "backend-metrics" is ready

        '
- title: Access the frontend service
  numbered: true
  preamble: 'In order to use and test the application, we need external access

    to the frontend.


    Use `kubectl port-forward` to make the frontend available at

    `localhost:9093`.'
  postamble: 'You can now access the web interface by navigating to

    [http://localhost:9093](http://localhost:9093) in your browser.


    The backend metrics are also accessible at [http://localhost:9192](http://localhost:9192).'
  commands:
    west:
    - await_resource: deployment/frontend
    - run: kubectl port-forward deployment/frontend 9094:9093
      apply: readme
    - run: kubectl port-forward deployment/frontend 9094:9093 > /dev/null &
      apply: test
    - await_port: 9094
    - run: curl http://localhost:9094/api/health
      apply: test
- name: cleaning_up
  title: Cleaning up
  numbered: false
  preamble: 'To remove Skupper and the other resources from this exercise, use

    the following commands:'
  commands:
    west:
    - run: skupper site delete --all
    - run: kubectl delete deployment/frontend
    east:
    - run: skupper site delete --all
    - run: kubectl delete deployment/backend
summary: 'This example locates the frontend and backend services in different

  namespaces, on different clusters.  Ordinarily, this means that they

  have no way to communicate unless they are exposed to the public

  internet.


  Introducing Skupper into each namespace allows us to create a virtual

  application network that can connect services in different clusters.

  Any service exposed on the application network is represented as a

  local service in all of the linked namespaces.


  The backend service is located in `east`, but the frontend service

  in `west` can "see" it as if it were local.  When the frontend

  sends a request to the backend, Skupper forwards the request to the

  namespace where the backend is running and routes the response back to

  the frontend.


  <img src="images/sequence.svg" width="640"/>

  '
